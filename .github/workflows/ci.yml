name: Reproducible portfolio evidence

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: wallet-ledger-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate private local credentials
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --mount type=bind,source="$PWD",target=/workspace
          --workdir /workspace oven/bun:1.4.4 bun scripts/setup-local.ts
      - name: Validate Compose model
        run: docker compose --profile test --profile observability config --quiet
      - name: Deploy the compiled local application and provisioned telemetry
        run: docker compose --profile observability up --build --detach --wait --wait-timeout 240 app prometheus grafana
      - name: Smoke the deployed application
        run: docker compose exec -T -e APP_BASE_URL=http://localhost:3000 app bun scripts/smoke.ts
      - name: Generate and validate synthetic telemetry evidence
        run: |
          docker run --rm --network host --env-file .env --mount type=bind,source="$PWD",target=/workspace --workdir /workspace oven/bun:1.4.4 bun scripts/telemetry-demo.ts
          docker run --rm --network host --env-file .env --mount type=bind,source="$PWD",target=/workspace --workdir /workspace oven/bun:1.4.4 bun scripts/validate-telemetry.ts
      - name: Verify source, tests, dependency audit and native Gitleaks
        run: docker compose --profile test run --build --rm tester
      - name: Package the verified public distribution
        run: docker compose --profile test run --no-deps --rm tester bun scripts/package-portfolio.ts --apply
      - name: Independently scan the exact staged distribution read only
        run: |
          sudo chown -R "$(id -u):$(id -g)" evidence/latest artifacts/public
          stage=$(node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("artifacts/public/package-manifest.json","utf8")).stageRelativePath;if(!/^artifacts\/private\/distribution-stage\/[a-f0-9-]{36}$/.test(p))process.exit(1);process.stdout.write(p)')
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount type=bind,source="$PWD/$stage",target=/scan,readonly \
            --mount type=bind,source="$PWD/.gitleaks.toml",target=/policy.toml,readonly \
            --entrypoint /bin/sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            'gitleaks dir /scan --config /policy.toml --redact --report-format json --report-path /tmp/findings.json >/tmp/stdout.log 2>/tmp/stderr.log; result=$?; if [ "$result" -eq 0 ]; then printf "{\"gitleaks\":\"PASSED\"}\n"; else printf "{\"gitleaks\":\"FAILED\"}\n"; fi; exit "$result"'
      - name: Make curated evidence readable by the artifact uploader
        if: always()
        run: |
          if [ -d evidence/latest ]; then sudo chown -R "$(id -u):$(id -g)" evidence/latest; fi
          if [ -d artifacts/public ]; then sudo chown -R "$(id -u):$(id -g)" artifacts/public; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wallet-ledger-lab-public-evidence
          path: |
            evidence/latest/summary.json
            evidence/latest/REPORT.md
            evidence/latest/junit.unit.xml
            evidence/latest/junit.integration.xml
            evidence/latest/source-manifest.json
            evidence/latest/status.svg
            evidence/latest/test-badge.svg
            evidence/latest/SHA256.txt
            evidence/latest/telemetry.json
            evidence/latest/metrics.prom
            evidence/latest/telemetry-validation.json
            artifacts/public/wallet-ledger-lab.zip
            artifacts/public/wallet-ledger-lab.zip.sha256
            artifacts/public/package-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop dedicated CI containers
        if: always()
        run: docker compose --profile test --profile observability down
