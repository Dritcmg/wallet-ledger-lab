global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: wallet-ledger-lab
    metrics_path: /metrics
    static_configs:
      - targets: [app:3000]
    # Bound collection to the application metrics used by this local study.
    sample_limit: 1000
    label_limit: 12
    label_name_length_limit: 64
    label_value_length_limit: 160
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: wager_.*
        action: keep
